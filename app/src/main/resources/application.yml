spring:
  application:
    name: domuvai

  # One database, schema-per-module (ADR-003). The connection's search_path spans the
  # module schemas so an unqualified @Table("entrance") resolves to registry.entrance,
  # while table names stay unique across schemas.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/domuvai?currentSchema=registry,identity_org,assembly,money,maintenance,compliance,evidence,app,public}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  # Flyway owns the schema. V1 is the hand-reviewed DDL; it creates its own schemas and
  # keeps its history table in public, where the unqualified DOMAINs (money_minor, …) live.
  flyway:
    default-schema: public
    locations: classpath:db/migration

  # The event publication registry is the outbox: an event is stored in the same
  # transaction as the change that raised it, then delivered to module listeners.
  modulith:
    events:
      # A reaction that did not finish — the process stopped, or its commit failed — is delivered again when the
      # application next starts. Every reaction is idempotent for that reason (delivery is at least once).
      republish-outstanding-events-on-restart: true
      jdbc:
        schema-initialization:
          enabled: true

# Sign-in (ADR-011): the api validates tokens signed by an OIDC issuer — Keycloak — and issued for this api.
# Both set: every /api/** request needs such a token. Closed unless told otherwise: with no issuer the application
# does not start, unless DOMUVAI_AUTH=off says in so many words that it runs open — a machine of one's own.
# An issuer with no audience stops the application at start.
domuvai:
  auth:
    issuer-uri: ${DOMUVAI_AUTH_ISSUER:}
    audience: ${DOMUVAI_AUTH_AUDIENCE:}
    mode: ${DOMUVAI_AUTH:}
    # The deployment's administrators (PM-SEC-001): subjects of the issuer above — the token's `sub`, an id the issuer
    # gives and never a username — comma-separated. They tie logins to
    # parties and do nothing else; nobody becomes one through the api. Naming any with no issuer stops the application.
    admins: ${DOMUVAI_AUTH_ADMINS:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
