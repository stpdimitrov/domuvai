spring:
  application:
    name: domuvai

  # One database, schema-per-module (ADR-003). The connection's search_path spans the
  # module schemas so an unqualified @Table("entrance") resolves to registry.entrance,
  # while table names stay unique across schemas.
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/domuvai?currentSchema=registry,identity_org,assembly,money,maintenance,compliance,evidence,app,public}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  # Flyway owns the schema. V1 is the hand-reviewed DDL; it creates its own schemas and
  # keeps its history table in public, where the unqualified DOMAINs (money_minor, …) live.
  flyway:
    default-schema: public
    locations: classpath:db/migration

  # The event publication registry is the outbox: an event is stored in the same
  # transaction as the change that raised it, then delivered to module listeners.
  modulith:
    events:
      jdbc:
        schema-initialization:
          enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
