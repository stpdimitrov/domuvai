name: e2e

# E2E-01 — the whole chain on every PR: Postgres → the API from its jar (Flyway on an empty database) → a seed
# through the public API → the production web server → tools/check_e2e.py, which validates every response the live
# screens use against the published contract and reads the seeded figures off the screens themselves.
# AUTH-03 — signed in: a real Keycloak imports the realm this repository describes (infra/keycloak), the API runs
# closed against it, and the check signs in as a person does — through Keycloak's own form — before it reads a screen;
# then it signs out. A second web server from the same build, with nothing set, must serve no console page
# (PM-DEBT-011); a fourth, told to run without sign-in, is what that one is compared with. The landing offers the demo
# form only where the server has an address to write to — the first has one, the second none, a third a value that is
# not an address (#79). Every secret here is made at run time and masked; none is in the repository.
# AUTH-04 — who may do what: the names a screen draws from the book are for the entrance's manager, board and controller.
# So a third identity is this run's administrator (DOMUVAI_AUTH_ADMINS), and through the API — never SQL — it says who
# the person signing in and the check's own client are, and records the first on the board and the second as the
# controller of every seeded entrance.
# AUTH-05c — who lives in a unit is entered in the book by the manager or the board, never the controller: a fourth
# identity, the check's manager client, sits on each entrance's board beside the person signing in (an entrance has a
# manager or a board, never both), and the check enters the book with it.
# Not path-filtered, so it runs on every PR — a required check on main.
on:
  push: { branches: [main] }
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env: { NEXT_TELEMETRY_DISABLED: '1', ISSUER: 'http://localhost:8180/realms/domuvai' }
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: domuvai, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r tools/requirements.txt

      - name: Start Keycloak with the realm this repository describes
        run: |
          mkdir -p "$RUNNER_TEMP/realm" && cp infra/keycloak/domuvai-realm.json "$RUNNER_TEMP/realm/"
          admin=$(openssl rand -hex 16); echo "::add-mask::$admin"; echo "KC_ADMIN=$admin" >> "$GITHUB_ENV"
          docker run -d --name keycloak -p 8180:8080 -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD="$admin" \
            -v "$RUNNER_TEMP/realm:/opt/keycloak/data/import:ro" quay.io/keycloak/keycloak:26.3 start-dev --import-realm

      - name: Build the API and the web
        run: |
          ./gradlew :app:bootJar
          (cd web && npm ci && npm test && npm run build)   # the web's own tests: sign-in's checks (AUTH-03a)

      - name: Start the API open, seed the demo entrance and a small one with a business unit through the public API, stop it
        run: |
          # the seed carries no token, so it runs before the API is closed; everything checked below runs against it closed
          DOMUVAI_AUTH=off nohup java -jar app/build/libs/app.jar > api-seed.log 2>&1 &
          echo $! > api.pid
          curl -sf --max-time 10 --retry 60 --retry-connrefused --retry-delay 2 http://localhost:8080/actuator/health
          entrance=$(SEED_OWNERS_FILE=owners.json python3 tools/seed_demo.py http://localhost:8080)   # an assignment, so a failed seed fails the step
          echo "ENTRANCE=$entrance" >> "$GITHUB_ENV"
          # an owner of the seeded entrance, to co-sign a posting act through the page (WEB-28, PM-GA-007): no API read names one
          echo "OWNER_PARTY=$(python3 -c 'import json; print(json.load(open("owners.json"))["Стефан Димов"])')" >> "$GITHUB_ENV"
          kill "$(cat api.pid)"
          while kill -0 "$(cat api.pid)" 2>/dev/null; do sleep 1; done

      - name: A client secret, a person to sign in as, the check's own client and the run's administrator — made here, in the running Keycloak
        run: |
          curl -sf -o /dev/null --max-time 10 --retry 60 --retry-connrefused --retry-all-errors --retry-delay 3 "$ISSUER/.well-known/openid-configuration"
          kc() { docker exec -i keycloak /opt/keycloak/bin/kcadm.sh "$@"; }
          kc config credentials --server http://localhost:8080 --realm master --user admin --password "$KC_ADMIN"
          secret=$(openssl rand -hex 24); password=$(openssl rand -hex 16); check=$(openssl rand -hex 24); administrator=$(openssl rand -hex 24); manager=$(openssl rand -hex 24)
          for value in "$secret" "$password" "$check" "$administrator" "$manager"; do echo "::add-mask::$value"; done
          id=$(kc get clients -r domuvai -q clientId=domuvai-web --fields id --format csv --noquotes)
          kc update "clients/$id" -r domuvai -s "secret=$secret"
          kc create users -r domuvai -s username=ivan -s enabled=true -s emailVerified=true -s email=ivan@example.test -s firstName=Ivan -s lastName=Petrov
          kc set-password -r domuvai --username ivan --new-password "$password"
          subject=$(kc get users -r domuvai -q username=ivan -q exact=true --fields id --format csv --noquotes)
          # the seeded owner signs in too, as a second person (WEB-48): a service client's token cannot drive the web, which signs people in at a browser
          kc create users -r domuvai -s username=stefan -s enabled=true -s emailVerified=true -s email=stefan@example.test -s firstName=Stefan -s lastName=Dimov
          kc set-password -r domuvai --username stefan --new-password "$password"
          owner_subject=$(kc get users -r domuvai -q username=stefan -q exact=true --fields id --format csv --noquotes)
          # … and so does the deployment's administrator (WEB-49): a user named in DOMUVAI_AUTH_ADMINS and tied to no party, who records and ends mandates through the page (and, in WEB-49b, ties logins)
          kc create users -r domuvai -s username=admin -s enabled=true -s emailVerified=true -s email=admin@example.test -s firstName=Admin -s lastName=Domuvai
          kc set-password -r domuvai --username admin --new-password "$password"
          admin_subject=$(kc get users -r domuvai -q username=admin -q exact=true --fields id --format csv --noquotes)
          # … and a login that is nobody and holds no role (WEB-50): the API lists it no entrance, and the page says so
          kc create users -r domuvai -s username=nobody -s enabled=true -s emailVerified=true -s email=nobody@example.test -s firstName=No -s lastName=Role
          kc set-password -r domuvai --username nobody --new-password "$password"
          none_subject=$(kc get users -r domuvai -q username=nobody -q exact=true --fields id --format csv --noquotes)
          # The check asks the API itself, so it needs a token of its own; and somebody has to be the deployment's
          # administrator (AUTH-04c) — a login that is nobody in the book. Two clients that exist only in this run's
          # Keycloak — never in the realm file, which gives no client a service account.
          service_client() {
            kc create clients -r domuvai -f - <<JSON
          { "clientId": "$1", "protocol": "openid-connect", "publicClient": false, "secret": "$2",
            "standardFlowEnabled": false, "directAccessGrantsEnabled": false, "serviceAccountsEnabled": true,
            "attributes": { "access.token.lifespan": "1800" },
            "protocolMappers": [ { "name": "the api's audience", "protocol": "openid-connect", "protocolMapper": "oidc-audience-mapper",
              "config": { "included.custom.audience": "domuvai-api", "access.token.claim": "true", "id.token.claim": "false" } } ] }
          JSON
            kc get "clients/$(kc get clients -r domuvai -q "clientId=$1" --fields id --format csv --noquotes)/service-account-user" -r domuvai --fields id --format csv --noquotes
          }
          check_subject=$(service_client e2e-check "$check" | tail -n 1)
          administrator_subject=$(service_client e2e-administrator "$administrator" | tail -n 1)
          manager_subject=$(service_client e2e-manager "$manager" | tail -n 1)        # enters the book as the board (AUTH-05c)
          test -n "$subject" && test -n "$owner_subject" && test -n "$admin_subject" && test -n "$none_subject" && test -n "$check_subject" && test -n "$administrator_subject" && test -n "$manager_subject"
          { echo "WEB_SECRET=$secret"; echo "E2E_PASSWORD=$password"; echo "CHECK_SECRET=$check"; echo "SUBJECT=$subject"; echo "OWNER_SUBJECT=$owner_subject"; echo "ADMIN_SUBJECT=$admin_subject"; echo "NONE_SUBJECT=$none_subject";
            echo "CHECK_SUBJECT=$check_subject"; echo "ADMINISTRATOR_SECRET=$administrator"; echo "ADMINISTRATOR_SUBJECT=$administrator_subject";
            echo "MANAGER_SECRET=$manager"; echo "MANAGER_SUBJECT=$manager_subject"; } >> "$GITHUB_ENV"

      - name: Start the API closed — it accepts only a token this Keycloak signed for it (ADR-011)
        env: { DOMUVAI_AUTH_ISSUER: '${{ env.ISSUER }}', DOMUVAI_AUTH_AUDIENCE: domuvai-api, DOMUVAI_AUTH_ADMINS: '${{ env.ADMINISTRATOR_SUBJECT }},${{ env.ADMIN_SUBJECT }}' }
        run: |
          nohup java -jar app/build/libs/app.jar > api.log 2>&1 &
          curl -sf --max-time 10 --retry 60 --retry-connrefused --retry-delay 2 http://localhost:8080/actuator/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/registry/entrances)" = 401   # closed: no token, no answer

      - name: The administrator says who is who — the person signing in and the check's manager client are each entrance's board, the check's client its controller (AUTH-04, AUTH-05c)
        run: |
          token() { curl -sf -d grant_type=client_credentials -d "client_id=$1" -d "client_secret=$2" "$ISSUER/protocol/openid-connect/token" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])'; }
          administrator=$(token e2e-administrator "$ADMINISTRATOR_SECRET"); check=$(token e2e-check "$CHECK_SECRET")
          echo "::add-mask::$administrator"; echo "::add-mask::$check"
          entrance="$ENTRANCE"
          # Before anybody is anybody the names are refused — to the check's client, and to the administrator, who never reads them.
          for bearer in "$check" "$administrator"; do
            test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $bearer" "http://localhost:8080/api/registry/entrances/$entrance/book/declarations/overdue")" = 403
          done
          ADMINISTRATOR="$administrator" python3 - <<'PY'
          import datetime, json, os, urllib.request
          API = "http://localhost:8080"
          def call(method, path, body=None):
              request = urllib.request.Request(API + path, method=method, data=json.dumps(body).encode() if body is not None else None,
                                               headers={"Content-Type": "application/json", "Authorization": f"Bearer {os.environ['ADMINISTRATOR']}"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  raw = response.read().decode()
                  return json.loads(raw) if raw else None
          today = datetime.date.today()
          first, last = str(today - datetime.timedelta(days=2)), str(today + datetime.timedelta(days=365))   # in force today, in Sofia as here
          # An entrance has a manager or a board, never both (a board member succeeds a manager): the person signing in and
          # the check's manager client are two members of the board (AUTH-05c), the check's own client the controller.
          offices = [("MB", os.environ["SUBJECT"], "Иван Петров (управителен съвет)"), ("MB", os.environ["MANAGER_SUBJECT"], "Проверката (управителен съвет)"),
                     ("CTL", os.environ["CHECK_SUBJECT"], "Проверката (контрольор)")]
          for office, subject, name in offices:
              party = call("POST", "/api/registry/parties", {"fullName": name})["partyId"]
              call("POST", "/api/identity/logins", {"subject": subject, "partyId": party})
              for entrance in call("GET", "/api/registry/entrances"):
                  call("POST", f"/api/identity/entrances/{entrance['id']}/mandates",
                       {"body": office, "partyId": party, "validFrom": first, "validTo": last, "protocolRef": "the end-to-end run"})
          # … and the seeded owner Стефан Димов is who the login stefan is: an owner by his title, holding no office (WEB-48)
          call("POST", "/api/identity/logins", {"subject": os.environ["OWNER_SUBJECT"], "partyId": os.environ["OWNER_PARTY"]})
          # … and one party holds no login and no office (WEB-49b ties a throwaway login to it): the administrator, signed in as admin, gives it a mandate and ends it in the same run (WEB-49)
          spare = call("POST", "/api/registry/parties", {"fullName": "Проверката (резервно лице)"})["partyId"]
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"SPARE_PARTY={spare}\n")
          PY
          # … and now the controller is given the names — and still anonymises nothing: reads all, writes none. The
          # administrator, who said who everybody is, is given none of it.
          code() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" ${3:+-X "$3"} "http://localhost:8080/api/registry/entrances/$entrance/$2"; }
          test "$(code "$check" book/declarations/overdue)" = 200
          test "$(code "$check" "owners?on=2026-09-01")" = 200
          test "$(code "$check" book/retention POST)" = 403
          test "$(code "$administrator" book/declarations/overdue)" = 403
          test "$(code "$administrator" "owners?on=2026-09-01")" = 403
          test "$(code "$administrator" book/retention POST)" = 403
          # … and so the office-holders' names beside the mandates (NAMES-01, PM-BOOK-006): every office the controller
          # reads is named; the administrator reads the same offices by id alone.
          named() { curl -sf -H "Authorization: Bearer $1" "http://localhost:8080/api/identity/entrances/$entrance/mandates" | python3 -c 'import json, sys
          ms = [m for m in json.load(sys.stdin) if m.get("partyId")]
          print("none read" if not ms else "all" if all(m.get("partyName") for m in ms) else "none" if not any("partyName" in m for m in ms) else "some")'; }
          test "$(named "$check")" = all
          test "$(named "$administrator")" = none
          # … and money's personal reads ask the policy too (PM-SEC-002): the controller reads the entrance's arrears,
          # the administrator — an office of no entrance — does not.
          arrears() { curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $1" "http://localhost:8080/api/money/entrances/$entrance/arrears?asOf=2026-09-01"; }
          test "$(arrears "$check")" = 200
          test "$(arrears "$administrator")" = 403
          # … and registering is the administrator's (AUTH-05e, PM-SEC-001): the controller registers no entrance and no party.
          register() { curl -s -o /dev/null -w '%{http_code}' -X POST -H "Authorization: Bearer $1" -H 'Content-Type: application/json' -d "$3" "http://localhost:8080/api/registry/$2"; }
          test "$(register "$check" entrances '{"address":"ул. Проверка 1","label":"Х","managementForm":"GA"}')" = 403
          test "$(register "$check" parties '{"fullName":"Проверката (отказано лице)"}')" = 403

      - name: Start the web against the API — signing people in, with nothing set, with a bad address, told to run without sign-in (PM-DEBT-011, #79)
        working-directory: web
        env: { API_URL: 'http://localhost:8080' }
        run: |
          DOMUVAI_AUTH_ISSUER="$ISSUER" DOMUVAI_AUTH_CLIENT_ID=domuvai-web DOMUVAI_AUTH_CLIENT_SECRET="$WEB_SECRET" \
            DOMUVAI_SESSION_SECRET="$(openssl rand -hex 32)" DOMUVAI_WEB_URL=http://localhost:3000 \
            DOMUVAI_CONTACT_EMAIL=demo@example.test nohup npx next start -p 3000 > ../web.log 2>&1 &
          nohup npx next start -p 3001 > ../web-closed.log 2>&1 &
          DOMUVAI_CONTACT_EMAIL='mailto:nobody@example.test' nohup npx next start -p 3002 > ../web-bad-contact.log 2>&1 &
          DOMUVAI_AUTH=off nohup npx next start -p 3003 > ../web-open.log 2>&1 &
          for port in 3000 3001 3002 3003; do
            curl -sf -o /dev/null --max-time 10 --retry 30 --retry-connrefused --retry-delay 1 "http://localhost:$port/"
          done

      - name: The chain, checked signed in — sign-in, contract conformance, the figures on screen, sign-out
        run: |
          token=$(curl -sf -d grant_type=client_credentials -d client_id=e2e-check -d "client_secret=$CHECK_SECRET" "$ISSUER/protocol/openid-connect/token" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          manager=$(curl -sf -d grant_type=client_credentials -d client_id=e2e-manager -d "client_secret=$MANAGER_SECRET" "$ISSUER/protocol/openid-connect/token" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["access_token"])')
          echo "::add-mask::$token"; echo "::add-mask::$manager"
          E2E_API_TOKEN="$token" E2E_MANAGER_TOKEN="$manager" python3 tools/check_e2e.py --api http://localhost:8080 --web http://localhost:3000 \
            --open-web http://localhost:3003 --closed-web http://localhost:3001 --bad-contact-web http://localhost:3002 \
            --contact demo@example.test --issuer "$ISSUER" --user ivan --subject "$SUBJECT" --entrance "$ENTRANCE" --owner-party "$OWNER_PARTY" \
            --owner-user stefan --owner-subject "$OWNER_SUBJECT" --admin-user admin --admin-subject "$ADMIN_SUBJECT" --none-user nobody --none-subject "$NONE_SUBJECT" --spare-party "$SPARE_PARTY"

      - name: Logs
        if: failure()
        run: |
          tail -n 150 api-seed.log api.log web.log web-closed.log web-bad-contact.log web-open.log || true
          docker logs keycloak 2>&1 | tail -n 120
