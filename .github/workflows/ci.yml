name: gates

on:
  push: { branches: [main] }
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions: { contents: read, pull-requests: read, issues: read }
    steps:
      - uses: actions/checkout@v4
      # A PR may change only the lanes its closing claim names (`claim … --also <lane>` for a second one): two
      # developers in one lane is how their work collides. Re-run the job after labelling the claim.
      - name: Every lane the PR touches is claimed
        if: github.event_name == 'pull_request'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: python3 tools/lanes.py covers ${{ github.event.pull_request.number }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r tools/requirements.txt
      - name: Gate pack
        run: ./tools/gates.sh
